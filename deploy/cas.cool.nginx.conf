# cascool production Nginx configuration example.
# See deploy/nginx.conf.template and deploy/README.md for automated variable substitution.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    ssl_certificate /etc/ssl/certs/cascool.crt;
    ssl_certificate_key /etc/ssl/private/cascool.key;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # Hide nginx version
    server_tokens off;

    ssl_certificate /etc/ssl/certs/cascool.crt;
    ssl_certificate_key /etc/ssl/private/cascool.key;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 50M;
    charset utf-8;

    # Static assets built by Next.js — served directly by Nginx
    location /_next/static/ {
        alias /path/to/cascool/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Uploaded media files
    location /uploads/ {
        alias /path/to/cascool/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # NOTE: /llms.txt is dynamic (src/app/llms.txt/route.ts) and reads SiteConfig.
    # Do NOT alias /llms.txt to a static file. Let it fall through to the Next.js app.

    # API routes & rate limit trust boundary:
    # Preserve client remote IP in X-Real-IP and proxy_add_x_forwarded_for
    # so route handlers can enforce rate limiting by IP.
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Hide nginx version
    server_tokens off;
    return 301 https://example.com$request_uri;
}
