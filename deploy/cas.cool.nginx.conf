# cas.cool production Nginx configuration.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cas.cool;

    ssl_certificate /etc/letsencrypt/live/cas.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cas.cool/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cas.cool$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cas.cool;

    # Hide nginx version
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cas.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cas.cool/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    charset utf-8;
    include /etc/nginx/snippets/security-headers.conf;
    access_log /var/log/nginx/cas_access.log;
    error_log /var/log/nginx/cas_error.log;

    location /_next/static/ {
        alias /var/www/cas.cool/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/cas.cool/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Exact match /api/v1 → 301 to /api/v1/ so the discovery index is reachable
    # without a trailing slash. Must come before the /api/v1/ prefix block.

    # Agent landing page — served directly by nginx to bypass the Next.js
    # /[username] dynamic route which would otherwise swallow /llms.txt.
    location = /llms.txt {
        alias /var/www/cas.cool/public/llms.txt;
        default_type text/plain;
    }

    # Stable, token-authenticated public API. It is deliberately isolated
    # from the Next.js web process so API resource limits and deployments do
    # not share the frontend runtime.

    # Internal Next.js API routes have been migrated to Server Actions.
    # Block all legacy /api/* paths at the edge — only /api/v1/ (above) is public.
    location ^~ /api/ {
        client_max_body_size 50M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cas.cool www.cas.cool;

    # Hide nginx version
    server_tokens off;
    return 301 https://cas.cool$request_uri;
}
