# cas.cool production Nginx configuration.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cas.cool;

    ssl_certificate /etc/letsencrypt/live/cas.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cas.cool/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cas.cool$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cas.cool;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Hide nginx version
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cas.cool/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cas.cool/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12M;
    charset utf-8;
    include /etc/nginx/snippets/security-headers.conf;
    # Explicit short maintenance window around incompatible schema changes.
    if (-f /var/www/cascool-shared/maintenance.flag) {
        return 503;
    }
    access_log /var/log/nginx/cas_access.log;
    error_log /var/log/nginx/cas_error.log;

    location /_next/static/ {
        alias /var/www/cas.cool/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Retired legacy verification attachment URLs - exact-path 404.
    # Disposition recorded in release DEPLOYMENT.md (restricted), 2026-10-30.
    location = /uploads/c50d5edf-0b3a-4a34-bd2e-39d8d2340b9a.webp { return 404; }
    location = /uploads/f576e839-e1fa-451f-b297-9104062744e3.webp { return 404; }
    location = /uploads/smoke-front.jpg { return 404; }
    location = /uploads/smoke-back.jpg { return 404; }

    location /uploads/ {
        alias /var/www/cas.cool/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Discovery is generated by the application from SiteConfig.
    location = /llms.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MCP uses the same application and identity boundary as REST.
    location = /mcp {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # REST authentication and rate limiting are enforced by the application.
    location ^~ /api/ {
        client_max_body_size 12M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cas.cool www.cas.cool;

    # Hide nginx version
    server_tokens off;

    # ACME HTTP-01 must be answered here, never redirected: certbot injects
    # a location for /.well-known/acme-challenge/ at renew time; a server-level
    # return would fire before any location and break renewal for www.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://cas.cool$request_uri;
    }
}
