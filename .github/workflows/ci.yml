name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cascool
          POSTGRES_PASSWORD: cascool
          POSTGRES_DB: cascool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cascool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cascool:cascool@localhost:5432/cascool?schema=public
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run build

      # API contract tests provision their own throwaway database
      # (cascool_test) and boot `next dev` on port 3199.
      - run: npx playwright install --with-deps chromium
      - run: npm test
